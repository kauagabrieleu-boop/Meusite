<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
    }

    .carrinho {
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .produto {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-top: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .produto h2 {
      margin-top: 0;
    }

    .preco {
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.8;
    }

    #mensagem {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>

</head>

<body>

  <header>
    <h1>MINHA LOJA</h1>

```
<div class="carrinho">
  🛒 Carrinho (<span id="quantidade">0</span>)
</div>
```

  </header>

  <div class="container">

```
<h2>Bem-vindo à minha loja!</h2>

<h2>Produtos</h2>

<div class="produto">
  <h2>Kit Criador — 1000 Ideias</h2>

  <p>
    Um kit com 1000 ideias para quem quer criar conteúdos,
    projetos e novos negócios.
  </p>

  <div class="preco">R$ 9,90</div>

  <button onclick="adicionarCarrinho()">
    Adicionar ao carrinho
  </button>

  <div id="mensagem"></div>
</div>
```

  </div>

  <script>
    let quantidade = 0;

    function adicionarCarrinho() {
      quantidade++;

      document.getElementById("quantidade").textContent = quantidade;

      document.getElementById("mensagem").textContent =
        "✅ Produto adicionado ao carrinho!";
    }
  </script>

</body>
</html>
